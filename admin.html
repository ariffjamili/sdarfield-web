<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDAR Project - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getFirestore,
            collection,
            query,
            onSnapshot,
            updateDoc,
            deleteDoc,
            addDoc,
            doc,
            orderBy,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Config (Your Specific Config) ---
        const firebaseConfig = {
            apiKey: "AIzaSyC3AK7ajQ8yzn9xwTy4PniDv_7bz97FwMA",
            authDomain: "sdar-field-rehab.firebaseapp.com",
            projectId: "sdar-field-rehab",
            storageBucket: "sdar-field-rehab.firebasestorage.app",
            messagingSenderId: "70995705826",
            appId: "1:70995705826:web:9a027ee70f70b818f943bb"
        };

        // Initialize
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = firebaseConfig.appId;

        // DOM Elements
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const currentUserEmailSpan = document.getElementById('current-user-email');

        // Tabs
        const tabComments = document.getElementById('tab-comments');
        const tabUpdates = document.getElementById('tab-updates');
        const sectionComments = document.getElementById('section-comments');
        const sectionUpdates = document.getElementById('section-updates');

        // Comments
        const commentsContainer = document.getElementById('comments-container');

        // Updates
        const postsContainer = document.getElementById('posts-container');
        const createPostForm = document.getElementById('create-post-form');
        const postTitle = document.getElementById('post-title');
        const postContent = document.getElementById('post-content');
        const postImage = document.getElementById('post-image');
        const createPostBtn = document.getElementById('create-post-btn');

        // --- Auth Logic ---

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                console.log("Admin logged in:", user.email);
                currentUserEmailSpan.innerText = user.email;
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                loadComments();
                loadPosts();
            } else {
                // User is signed out
                loginSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
            } catch (error) {
                console.error("Login failed", error);
                loginError.innerText = "Login failed: " + error.message;
                loginError.classList.remove('hidden');
            }
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // --- Tab Logic ---
        function switchTab(tab) {
            if (tab === 'comments') {
                tabComments.classList.add('bg-blue-100', 'text-blue-800');
                tabUpdates.classList.remove('bg-blue-100', 'text-blue-800');
                tabUpdates.classList.add('text-gray-600', 'hover:bg-gray-100');
                sectionComments.classList.remove('hidden');
                sectionUpdates.classList.add('hidden');
            } else {
                tabUpdates.classList.add('bg-blue-100', 'text-blue-800');
                tabComments.classList.remove('bg-blue-100', 'text-blue-800');
                tabComments.classList.add('text-gray-600', 'hover:bg-gray-100');
                sectionUpdates.classList.remove('hidden');
                sectionComments.classList.add('hidden');
            }
        }

        tabComments.addEventListener('click', () => switchTab('comments'));
        tabUpdates.addEventListener('click', () => switchTab('updates'));

        // --- Comments Logic ---

        function loadComments() {
            const commentsRef = collection(db, `artifacts/${appId}/public/data/comments`);
            const q = query(commentsRef);

            onSnapshot(q, (snapshot) => {
                commentsContainer.innerHTML = '';

                if (snapshot.empty) {
                    commentsContainer.innerHTML = '<p class="text-gray-500 text-center py-8">No comments found.</p>';
                    return;
                }

                const docs = snapshot.docs.map(doc => ({ id: doc.id, data: doc.data() }));

                docs.sort((a, b) => {
                    if (a.data.isApproved !== b.data.isApproved) {
                        return a.data.isApproved ? 1 : -1;
                    }
                    const timeA = a.data.timestamp ? a.data.timestamp.toDate() : 0;
                    const timeB = b.data.timestamp ? b.data.timestamp.toDate() : 0;
                    return timeB - timeA;
                });

                docs.forEach(item => renderComment(item.id, item.data));
            });
        }

        function renderComment(docId, data) {
            const dateStr = data.timestamp ? data.timestamp.toDate().toLocaleString() : 'N/A';
            const isApproved = data.isApproved;

            const div = document.createElement('div');
            div.className = `bg-white p-4 rounded-lg shadow border-l-4 ${isApproved ? 'border-green-500' : 'border-yellow-500'} mb-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition-all hover:shadow-md`;

            div.innerHTML = `
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="font-bold text-gray-800">${escapeHTML(data.name)}</span>
                        ${!isApproved ? '<span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-0.5 rounded-full font-semibold">Pending Review</span>' : '<span class="bg-green-100 text-green-800 text-xs px-2 py-0.5 rounded-full font-semibold">Approved</span>'}
                    </div>
                    <p class="text-gray-600 text-sm mb-2">${escapeHTML(data.comment)}</p>
                    <p class="text-xs text-gray-400">${dateStr}</p>
                </div>
                <div class="flex items-center gap-2 w-full md:w-auto">
                    ${!isApproved ? `<button onclick="window.approveComment('${docId}')" class="flex-1 md:flex-none bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700 transition">Approve</button>` : ''}
                    <button onclick="window.deleteComment('${docId}')" class="flex-1 md:flex-none bg-red-100 text-red-600 px-4 py-2 rounded text-sm hover:bg-red-200 transition">Delete</button>
                </div>
            `;
            commentsContainer.appendChild(div);
        }

        window.approveComment = async (docId) => {
            try {
                const docRef = doc(db, `artifacts/${appId}/public/data/comments`, docId);
                await updateDoc(docRef, { isApproved: true });
            } catch (error) {
                console.error("Error approving:", error);
                alert("Error approving: " + error.message);
            }
        };

        window.deleteComment = async (docId) => {
            if (!confirm("Are you sure you want to delete this comment permanently?")) return;
            try {
                const docRef = doc(db, `artifacts/${appId}/public/data/comments`, docId);
                await deleteDoc(docRef);
            } catch (error) {
                console.error("Error deleting:", error);
                alert("Error deleting: " + error.message);
            }
        };

        // --- Updates / Blog Logic ---

        function loadPosts() {
            const postsRef = collection(db, `artifacts/${appId}/public/data/posts`);
            const q = query(postsRef); // Client-side sort fallback if needed, but we can try orderBy here if index exists

            onSnapshot(q, (snapshot) => {
                postsContainer.innerHTML = '';

                if (snapshot.empty) {
                    postsContainer.innerHTML = '<p class="text-gray-500 text-center py-8">No updates posted yet.</p>';
                    return;
                }

                const docs = snapshot.docs.map(doc => ({ id: doc.id, data: doc.data() }));

                // Sort by timestamp desc
                docs.sort((a, b) => {
                    const timeA = a.data.timestamp ? a.data.timestamp.seconds : 0;
                    const timeB = b.data.timestamp ? b.data.timestamp.seconds : 0;
                    return timeB - timeA;
                });

                docs.forEach(item => renderPost(item.id, item.data));
            }, (error) => {
                console.error("Error loading posts:", error);
            });
        }

        function renderPost(docId, data) {
            const dateStr = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleString() : 'N/A';

            const div = document.createElement('div');
            div.className = "bg-white p-6 rounded-lg shadow mb-6 border border-gray-200";

            let imagePreview = '';
            if (data.imageUrl) {
                imagePreview = `<img src="${escapeHTML(data.imageUrl)}" class="h-20 w-20 object-cover rounded mr-4 bg-gray-100" />`;
            }

            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <div class="flex items-start">
                        ${imagePreview}
                        <div>
                            <h3 class="text-lg font-bold text-gray-900">${escapeHTML(data.title)}</h3>
                            <p class="text-xs text-gray-500 mb-2">Posted on: ${dateStr}</p>
                            <p class="text-sm text-gray-600 line-clamp-3">${escapeHTML(data.content)}</p>
                        </div>
                    </div>
                    <button onclick="window.deletePost('${docId}')" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-2 rounded">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </div>
            `;
            postsContainer.appendChild(div);
        }

        createPostForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            createPostBtn.disabled = true;
            createPostBtn.innerText = "Posting...";

            try {
                const postsRef = collection(db, `artifacts/${appId}/public/data/posts`);
                await addDoc(postsRef, {
                    title: postTitle.value,
                    content: postContent.value,
                    imageUrl: postImage.value,
                    timestamp: serverTimestamp()
                });

                // Reset form
                createPostForm.reset();
                alert("Update posted successfully!");

            } catch (error) {
                console.error("Error creating post:", error);
                alert("Error creating post: " + error.message);
            } finally {
                createPostBtn.disabled = false;
                createPostBtn.innerText = "Post Update";
            }
        });

        window.deletePost = async (docId) => {
            if (!confirm("Are you sure you want to delete this update? This cannot be undone.")) return;
            try {
                const docRef = doc(db, `artifacts/${appId}/public/data/posts`, docId);
                await deleteDoc(docRef);
            } catch (error) {
                console.error("Error deleting post:", error);
                alert("Error deleting post: " + error.message);
            }
        };

        function escapeHTML(str) {
            if (!str) return "";
            return str.replace(/[&<>"']/g, function (m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .tab-active {
            background-color: #DBEAFE;
            color: #1E40AF;
        }
    </style>
</head>

<body>

    <!-- Login Section -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <h1 class="text-2xl font-bold text-center text-blue-900 mb-6">Admin Login</h1>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email"
                        class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password"
                        class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required>
                </div>
                <div id="login-error" class="hidden text-red-500 text-sm text-center bg-red-50 p-2 rounded"></div>
                <button type="submit"
                    class="w-full bg-blue-700 text-white font-bold py-2 rounded-lg hover:bg-blue-800 transition">Sign
                    In</button>
            </form>
            <p class="text-xs text-gray-400 mt-4 text-center">SDAR Field Rehabilitation Project</p>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="hidden min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white shadow z-10 sticky top-0">
            <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <h1 class="text-xl font-bold text-blue-900">Admin Dashboard</h1>
                </div>
                <div class="flex items-center gap-4">
                    <span id="current-user-email" class="text-sm text-gray-600 hidden sm:inline"></span>
                    <button id="logout-btn"
                        class="text-sm text-red-600 hover:text-red-800 font-medium border border-red-200 px-3 py-1 rounded hover:bg-red-50 transition">Logout</button>
                </div>
            </div>
            <!-- Tabs -->
            <div class="max-w-5xl mx-auto px-4 mt-2 flex gap-2">
                <button id="tab-comments"
                    class="px-4 py-2 rounded-t-lg font-medium bg-blue-100 text-blue-800 transition">
                    Comments Moderation
                </button>
                <button id="tab-updates"
                    class="px-4 py-2 rounded-t-lg font-medium text-gray-600 hover:bg-gray-100 transition">
                    Project Updates (Blog)
                </button>
            </div>
        </header>

        <!-- Content -->
        <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-8">

            <!-- Section: Comments -->
            <div id="section-comments">
                <div class="flex justify-between items-end mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">All Comments</h2>
                    <div class="text-sm text-gray-500">
                        <span class="inline-block w-3 h-3 bg-yellow-400 rounded-full mr-1"></span> Pending
                        <span class="inline-block w-3 h-3 bg-green-500 rounded-full ml-3 mr-1"></span> Approved
                    </div>
                </div>
                <div id="comments-container" class="space-y-4">
                    <div class="animate-pulse space-y-4">
                        <div class="h-24 bg-gray-200 rounded"></div>
                        <div class="h-24 bg-gray-200 rounded"></div>
                    </div>
                </div>
            </div>

            <!-- Section: Updates -->
            <div id="section-updates" class="hidden">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

                    <!-- Create Post Form -->
                    <div class="lg:col-span-1">
                        <div class="bg-white rounded-xl shadow-md p-6 sticky top-32">
                            <h2 class="text-xl font-bold text-gray-800 mb-4">Post New Update</h2>
                            <form id="create-post-form" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                                    <input type="text" id="post-title"
                                        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        placeholder="e.g. Field Construction Completed" required>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Image URL
                                        (Optional)</label>
                                    <input type="url" id="post-image"
                                        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        placeholder="https://example.com/image.jpg">
                                    <p class="text-xs text-gray-400 mt-1">Paste a direct link to an image.</p>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Content</label>
                                    <textarea id="post-content" rows="6"
                                        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        placeholder="Write your update here..." required></textarea>
                                </div>
                                <button type="submit" id="create-post-btn"
                                    class="w-full bg-blue-700 text-white font-bold py-2 rounded-lg hover:bg-blue-800 transition shadow-md">
                                    Post Update
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- List of Posts -->
                    <div class="lg:col-span-2">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">Existing Updates</h2>
                        <div id="posts-container" class="space-y-6">
                            <div class="animate-pulse space-y-6">
                                <div class="h-40 bg-gray-200 rounded"></div>
                                <div class="h-40 bg-gray-200 rounded"></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </main>
    </div>

</body>

</html>
